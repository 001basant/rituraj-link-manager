<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b10">
  <title>Rituraj | Links</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="profile">
      <img id="avatar" class="avatar" src="https://i.pravatar.cc/300?img=12" alt="Profile">

      <div id="username" class="username">@yourusername</div>

    <section id="links" class="links" aria-label="Links"></section>
    <p id="emptyState" class="empty" hidden>No links available.</p>

    <footer>© <span id="year"></span> Rituraj</footer>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
