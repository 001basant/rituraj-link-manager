<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b10">
  <title>Rituraj | Admin</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <main class="wrap">
    <section id="loginPanel" class="panel">
      <h1>🔐 Admin Login</h1>
      <p class="muted">Login to manage your Instagram links.</p>
      <input id="email" type="email" placeholder="Email" autocomplete="email">
      <input id="password" type="password" placeholder="Password" autocomplete="current-password">
      <button id="loginBtn">Login</button>
      <p id="loginMsg" class="msg"></p>
    </section>

    <section id="appPanel" class="panel" hidden>
      <header class="topbar">
        <div>
          <h1>Link Manager</h1>
          <p class="muted">Add, edit, hide, delete and reorder links.</p>
        </div>
        <button id="logoutBtn" class="secondary">Logout</button>
      </header>

      <section class="profileBox">
        <h2>Profile</h2>
        <div class="grid">
          <input id="profileName" placeholder="Display name">
          <input id="profileUsername" placeholder="@username">
          <input id="profileAvatar" placeholder="Profile photo URL">
          <textarea id="profileBio" placeholder="Short bio"></textarea>
        </div>
        <button id="saveProfileBtn">Save Profile</button>
      </section>

      <section class="linksBox">
        <div class="sectionHead">
          <h2>Your Links</h2>
          <button id="addBtn">＋ Add Link</button>
        </div>
        <div id="linkList" class="linkList"></div>
      </section>
    </section>
  </main>

  <dialog id="editor">
    <form method="dialog" id="linkForm" class="dialog">
      <h2 id="editorTitle">Add Link</h2>
      <input id="linkTitle" placeholder="Link name" required>
      <input id="linkSubtitle" placeholder="Small description">
      <input id="linkUrl" type="url" placeholder="https://..." required>
      <input id="linkIcon" placeholder="Icon slug e.g. whatsapp, instagram, youtube" required>
      <label class="switchRow"><input id="linkEnabled" type="checkbox" checked> Visible on public page</label>
      <div class="actions">
        <button type="button" class="secondary" id="cancelBtn">Cancel</button>
        <button type="submit">Save</button>
      </div>
      <p id="editMsg" class="msg"></p>
    </form>
  </dialog>

  <script type="module" src="admin.js"></script>
</body>
</html>
